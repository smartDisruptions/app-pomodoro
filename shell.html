<!doctype html>
<html lang="en" data-theme="night" data-q="0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patch's Pomodoro</title>
<meta name="description" content="A pomodoro timer with Patch from the Neo Dojo cast. Wind the tomato, quarantine your distractions, grow the windowsill. Lo-fi focus that works offline and runs fast on any phone.">
<meta name="theme-color" content="#0c0f22">
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pomodoro">
<meta property="og:type" content="website">
<meta property="og:title" content="Patch's Pomodoro">
<meta property="og:description" content="Lo-fi focus with Patch, one tomato at a time.">
<meta property="og:image" content="og.png">
<meta name="twitter:card" content="summary_large_image">
<style>
/*FONTS*/
/* ── tokens (DESIGN.md §4). Modules use these variables; never hard-code a theme colour in a module. ── */
:root {
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  --display: "Dela Gothic One", "Arial Black", Impact, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --mint: #3dffc2; --mint-rgb: 61, 255, 194; --amber: #ffb35c; --gold: #f5c542; --tomato: #ff4a3d; --tomato-deep: #c8231a;
  --rogue: #ff2340; --line: #3d4c95; --moon: #a9bcff;
  --r-s: 10px; --r-m: 16px; --r-l: 24px; --r-pill: 999px;
  --ease: cubic-bezier(.2, .8, .2, 1); --ease-back: cubic-bezier(.34, 1.56, .64, 1); --ease-in: cubic-bezier(.5, 0, .75, 0);
  --t-fast: 140ms; --t-med: 260ms; --t-slow: 480ms;
  --tap: 44px;
}
:root[data-theme="night"] {
  color-scheme: dark;
  --bg: #0c0f22; --surface: #151a35; --surface-2: #1b2145; --surface-3: #232a55; --border: #2a3366;
  --text: #eef1f8; --muted: #9aa3cf; --dim: #5a6280;
  --accent: #3dffc2; --on-accent: #052a1f; --break: #ffb35c; --on-break: #2a1600;
  --scrim: rgba(5, 6, 16, .58); --shadow: 0 12px 32px rgba(0, 0, 0, .45); --glass: rgba(21, 26, 53, .86);
}
:root[data-theme="day"] {
  color-scheme: light;
  --bg: #f4efe6; --surface: #fffaf2; --surface-2: #f3ebdf; --surface-3: #e9dfcf; --border: #d9ccb7;
  --text: #1a1b2e; --muted: #5d5f7a; --dim: #9a9cb2;
  --accent: #0c9c79; --on-accent: #ffffff; --break: #c9721a; --on-break: #ffffff;
  --scrim: rgba(30, 24, 16, .32); --shadow: 0 12px 32px rgba(60, 40, 20, .18); --glass: rgba(255, 250, 242, .9);
}
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.45 var(--body); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { overflow: hidden; overscroll-behavior: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#scene { position: fixed; left: 0; top: 0; display: block; touch-action: none; }
#app { position: fixed; inset: 0; pointer-events: none; }
#app > * { pointer-events: none; }
#app button, #app a, #app input, #app textarea, #app select, #app label, #app [data-hit] { pointer-events: auto; }
#live, .sr { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.ic { width: 1.25em; height: 1.25em; display: inline-block; vertical-align: -.22em; flex: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea { font: inherit; color: inherit; -webkit-user-select: text; user-select: text; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
/* reduced motion: core sets html.rm from the setting and the OS; functional motion (the dial) steps instead */
html.rm *, html.rm *::before, html.rm *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
/* the controls appear once main says so (html.ui: the art is baked, or 0.7 s passed); the room fades in when
   its art is ready (html.ready), so a slow phone can start a session before Patch's room has finished baking */
#app { opacity: 0; transition: opacity .35s var(--ease); }
html.ui #app { opacity: 1; }
#scene { opacity: 0; transition: opacity .6s var(--ease); }
html.ready #scene { opacity: 1; }
#boot { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); color: var(--muted); font: 600 12px/1 var(--mono); letter-spacing: .2em; text-transform: uppercase; transition: opacity .4s var(--ease); z-index: 50; pointer-events: none; }
html.ui #boot { opacity: 0; }
#boot b { display: block; width: 46px; height: 42px; margin: 0 auto 14px; border-radius: 50% 50% 46% 46%; background: radial-gradient(circle at 34% 30%, #ff9a86, #ff4a3d 45%, #c8231a); box-shadow: 0 0 40px rgba(255, 74, 61, .35); }
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div id="app">
  <header id="top"></header>
  <div id="bubble"></div>
  <main id="dial" aria-label="Pomodoro timer"></main>
  <div id="activity"></div>
  <nav id="dock" aria-label="Sections"></nav>
  <div id="sheets"></div>
  <div id="toasts"></div>
</div>
<div id="live" aria-live="polite"></div>
<div id="boot" aria-hidden="true"><div><b></b>Winding the tomato</div></div>
<noscript><p style="position:fixed;inset:auto 0 40%;text-align:center;font-family:system-ui">Patch's Pomodoro needs JavaScript to run.</p></noscript>
<script>/*SCRIPT*/</script>
</body>
</html>
